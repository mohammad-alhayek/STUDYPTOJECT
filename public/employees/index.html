<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employees Management</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a href="../users/index.html">Users</a>
        <a href="#" class="active">Employees</a>
      </div>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </nav>

    <div class="main-content">
      <h2>Employees Management Panel</h2>

      <div class="card">
        <h3>Add New Employee</h3>
        <form id="employeeForm">
          <div class="form-grid">
            <input
              type="text"
              id="empUserId"
              placeholder="User ID (Required/NOT NULL)"
              required
            />
            <input
              type="text"
              id="empFullName"
              placeholder="Full Name (Required/NOT NULL)"
              required
            />
            <input type="text" id="empPhone" placeholder="Phone Number" />
            <input type="text" id="empDept" placeholder="Department" />
            <input
              type="number"
              step="0.01"
              id="empSalary"
              placeholder="Salary"
            />
            <input type="date" id="empHireDate" placeholder="Hire Date" />
            <input type="text" id="empAddress" placeholder="Address" />
          </div>
          <button type="submit" class="btn" style="margin-top: 15px">
            Add Employee
          </button>
        </form>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>User ID</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employeesTableBody"></tbody>
      </table>
    </div>
    <script src="../js/employees.js"></script>
  </body>
</html>
