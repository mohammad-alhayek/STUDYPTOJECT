<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employees Management</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a href="/users">Users</a>

        <a href="/employees">Employees</a>

        <a href="/companies">Companies</a>

        <a href="/departments" class="active">Departments</a>
      </div>

      <button id="logoutBtn" class="btn-danger">Logout</button>
    </nav>

    <div class="main-content">
      <h2>Employees Management Panel</h2>

      <!-- ADD EMPLOYEE (ADMIN ONLY) -->

      <div class="card" id="addEmployeeCard">
        <h3 id="formTitle">Add New Employee</h3>

        <form id="employeeForm">
          <input type="hidden" id="employeeId" />

          <div class="form-grid">
            <input
              type="text"
              id="empFullName"
              placeholder="Full Name"
              required
            />

            <input type="email" id="empEmail" placeholder="Email" required />

            <input
              type="password"
              id="empPassword"
              placeholder="Password (For new user)"
            />

            <input type="text" id="empPhone" placeholder="Phone Number" />

            <input type="text" id="empDept" placeholder="Department" />

            <input
              type="number"
              step="0.01"
              id="empSalary"
              placeholder="Salary"
            />

            <input type="date" id="empHireDate" />

            <input type="text" id="empAddress" placeholder="Address" />
          </div>

          <button type="submit" class="btn" style="margin-top: 15px">
            Save Employee
          </button>

          <button
            type="button"
            id="cancelEditBtn"
            class="btn-secondary"
            style="display: none"
          >
            Cancel
          </button>
        </form>
      </div>

      <!-- FILTER (ADMIN ONLY) -->

      <div class="card" id="filterEmployeeCard">
        <h3>Filter Employees</h3>

        <input type="number" id="minSalary" placeholder="Min Salary" />

        <input type="number" id="maxSalary" placeholder="Max Salary" />

        <input type="date" id="startDate" />

        <input type="date" id="endDate" />

        <button id="filterBtn" class="btn">Search</button>

        <button id="clearFilterBtn" class="btn-secondary">Clear</button>
      </div>

      <!-- EMPLOYEES TABLE -->

      <table class="data-table">
        <thead>
          <tr>
            <th>Full Name</th>

            <th>Email</th>

            <th>Department</th>

            <th>Salary</th>

            <th>Phone</th>

            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="employeesTableBody"></tbody>
      </table>
    </div>

    <script src="/js/employees.js"></script>
  </body>
</html>
