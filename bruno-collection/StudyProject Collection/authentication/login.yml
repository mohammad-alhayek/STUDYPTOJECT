info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/auth/login"
  body:
    type: json
    data: |-
      {  "email": "lara@example.com",

      "password":"123456"}
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
