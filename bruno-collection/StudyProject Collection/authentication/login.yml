info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/auth/login"
  headers:
    - name: Accept-Language
      value: ar
  body:
    type: json
    data: |-
      {
        "email": "existing@gmail.com",
        "password": "33333333"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
